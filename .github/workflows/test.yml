name: Test APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms android testapp
      - run: cd testapp && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: testapp/build/app/outputs/flutter-apk/app-release.apk
