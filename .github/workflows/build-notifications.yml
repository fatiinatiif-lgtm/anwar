name: Build APK (with notifications)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat anwar_part_* > all.zip && unzip -q all.zip
      - name: Apply updates
        run: |
          cp hekma.txt elhama.txt sera.txt anwar_library/assets/index/
          cp about_us.txt fadl_salah.txt anwar_1.txt anwar_2.txt anwar_3.txt mubarakat.txt munajat.txt poem1.txt poem2.txt anwar_library/assets/texts/
          cp author_home.jpg anwar_library/assets/images/
          cp newbooks/*.pdf anwar_library/assets/books/ || true
          cp newbooks/*.jpg anwar_library/assets/covers/ || true
          cp newbooks/*.txt anwar_library/assets/index/ || true
          cd anwar_library
          cp ../main.dart lib/main.dart
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/ArefRuqaa-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf || rm -f assets/fonts/ArefRuqaa-Bold.ttf
          python3 ../add_fadl.py lib/main.dart
          python3 ../add_notifications.py dart lib/main.dart
      - name: Fix pubspec
        working-directory: anwar_library
        run: |
          sed -i '/^[[:space:]]*fon:[[:space:]]*any[[:space:]]*$/d' pubspec.yaml
          echo "----- pubspec.yaml -----"
          cat pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: anwar_library
        run: |
          flutter create --org com.anwar --project-name anwar_library --platforms android .
          flutter pub add url_launcher font_awesome_flutter scrollable_positioned_list flutter_local_notifications timezone
          python3 ../add_notifications.py android
          # أصوات الإشعارات (الصيغ المسجّلة) -> res/raw
          mkdir -p android/app/src/main/res/raw
          cp ../salawat_*.mp3 android/app/src/main/res/raw/ || true
          cp ../sounds/salawat_*.mp3 android/app/src/main/res/raw/ || true
          ls -la android/app/src/main/res/raw
          cat > android/app/src/main/res/raw/keep.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/salawat_*" />
          XML
          sed -i 's/android:label="[^"]*"/android:label="مكتبة الأنوار المحمدية"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, glob
          done = False
          for f in glob.glob('android/app/build.gradle*'):
              s = open(f, encoding='utf-8').read()
              n, c = re.subn(r'compileSdk(Version)?\s*=?\s*[^\n]+', 'compileSdk = 37', s)
              if c == 0:
                  n = re.sub(r'android\s*\{', 'android {\n    compileSdk = 37', s, count=1)
              open(f, 'w', encoding='utf-8').write(n)
              print('=====', f)
              print(n)
              done = done or 'compileSdk = 37' in n
          assert done, 'compileSdk not patched'
          PY
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anwar-apk
          path: anwar_library/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
