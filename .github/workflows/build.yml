name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat anwar_part_* > all.zip && unzip -q all.zip
      - name: Shrink PDFs
        run: |
          sudo apt-get install -y ghostscript > /dev/null
          cd anwar_library/assets/books
          for f in $(find . -name '*.pdf' -size +10M); do
            gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -dPDFSETTINGS=/ebook -sOutputFile=/tmp/x.pdf "$f" && [ -s /tmp/x.pdf ] && mv /tmp/x.pdf "$f" || true
          done
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: anwar_library
        run: |
          flutter create --org com.anwar --project-name anwar_library --platforms android .
          sed -i 's/android:label="[^"]*"/android:label="مكتبة الأنوار المحمدية"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: anwar-apks
          path: anwar_library/build/app/outputs/flutter-apk/*-release.apk
