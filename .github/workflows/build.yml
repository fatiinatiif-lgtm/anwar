name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat anwar_part_* > all.zip && unzip -q all.zip
      - name: Apply updates
        run: |
          cp hekma.txt anwar_library/assets/index/hekma.txt
          cd anwar_library
          patch -l lib/main.dart < ../updates.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: anwar_library
        run: |
          flutter create --org com.anwar --project-name anwar_library --platforms android .
          flutter pub add url_launcher font_awesome_flutter
          sed -i 's/android:label="[^"]*"/android:label="مكتبة الأنوار المحمدية"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anwar-apk
          path: anwar_library/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
