name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat anwar_part_* > all.zip && unzip -q all.zip
      - name: Add Hekma index
        run: |
          cat > anwar_library/assets/index/hekma.txt <<'EOF'
          المقدمة|6
          الحِكمَةُ فَيضُ المَنَّانِ|7
          آمِنْ وأيقِنْ بالقَضا|9
          الرَّحمَةُ خُلُقُ العَدناني|13
          إذا ذُكِرَ الوفاءُ رَأيتَ طه|16
          كنْ بالتواضُعِ ما حَييتَ مُؤدَّبا|18
          الحُبُّ مِيزانُ العَمَلْ|20
          الزَمْ لذِكرِ اللهِ في الأسحارِ|23
          دَاوِمْ على خُلُقِ الرضا|26
          أَخلِص أخي للهِ في الأعمالِ|28
          الزَمْ أخيْ لمَكارمِ الأخلاقِ|30
          الصدقُ طَبعُ الصالحينْ|32
          العفوُ مِن شِيَمِ الكِرامْ|34
          اترُكْ وفارِقْ مَن يُهينُكْ|36
          اللهُ يَفعلُ ما يشاءْ|37
          البِرُّ والمعروفُ لا يُنسَى|39
          بِسْمِ الذي خَلَقَ السَّما|41
          مُحمدِنا وشافعِنا|44
          سلامٌ على المحبوبِ والمُختارِ|46
          صلاةُ اللهِ والذاتِ|49
          صلاةٌ مِن الرحمنِ عَدَّ الكواكبِ|52
          العِزُّ بتقوى اللهِ يَكونْ|54
          الزَمْ مُرافَقَةَ الكرامْ|56
          آثِر أخاكَ بما تُحِبُّ تَكرُّماً|58
          الزَمْ شِعارَ الصالحينْ|60
          مُحِبُّ المصطفى يَسلَمْ|62
          نحنُ جميعاً للقُبورِ مَصيرُنا|65
          يا ربَّنا صلِّ على|68
          صَلواتٌ تَتوالى دوماً|71
          سَعَيتُ لعَلّيْ أنْ أَنالَ حَلالا|73
          ياربِّ صلِّ على الحبيب|75
          يُحِبُّ المصطفى قلبي|78
          عَجَزَ اللسانُ فلا يَفِي مَعناهُ|81
          اِنسَ الهُمومَ بذِكرِ طه الهادي|84
          ذِكرُ النبيِّ يُداوي كلَّ ذي عِلَلِ|88
          مُحمَّدُنا هوَ الهادي|90
          ما الحُبُّ إلا للحبيبِ محمد|92
          اِسمِ النبيِّ|94
          جِئناكَ يا مُختارُ نرجو نَظرَةً|96
          صَلواتُ اللهِ عليك|98
          بدأتُ القَولَ بسمِ اللهْ|100
          سَلامي على مَن جاءَ بالدِينَ والهُدى|105
          اِصبِر على ضِيقِ المَعيشَةِ واصطَبِر|107
          جَزَى اللهُ خيرَ المُرسَلين مُحمَّدا|111
          حبي رسولُ اللهِ نورٌ ورَحمةٌ|115
          ياربِّ صَلِّ مُسَلِّماً|118
          قالَ النبيُّ مِعَلِّماً ومُبَيِّنا|121
          مَولِدُ الهادي|122
          أهْلاً وبُشرى بالنبيِّ الزَّينْ|125
          سَألتُ اللهَ في شَهرِ الرَّبِيعِ|130
          الشُكرُ للهادي علينا واجبُ|132
          شَهرُ الربيعِ|134
          رسولَ اللهِ دَاوِ فَتىً جَريحا|136
          أمُّ خيرِ الخَلقِ|138
          عصفورٌ يَشدو مُبتهِلاً|140
          في ليلةِ مِيلادِ الهادي|141
          رسُولَ اللهِ أرجوكَ القَبولا|144
          إنْ كُنتَ حَقَّاً تَدَّعي حُبَّ النَّبيْ|147
          عَليكَ سَلامُ اللهِ يا أيُّها النَّبيْ|149
          يا سَيدَ الرسلِ الكرامِ|152
          أهلاً بِرسولِ اللهِ|155
          النّورُ هوَ الهَاديْ أحمَد|158
          صلى عليكَ اللهُ يا أيُّها النبيْ|160
          نورُ النبيِّ المصطفى شُرياني|162
          بِطيبةَ روضٌ للنبيِّ مُحببُ|165
          تَحَرَّ الصِدقَ في قولٍ وفعلٍ|167
          EOF
      - name: Add poet title
        run: |
          python3 - <<'PY'
          p = 'anwar_library/lib/main.dart'
          s = open(p, encoding='utf-8').read()
          old = 'const AuthorPhoto(),'
          assert s.count(old) == 1
          add = "\n                const SizedBox(height: 12),\n                const Center(child: Text('شاعر رسول الله ﷺ', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: green))),"
          open(p, 'w', encoding='utf-8').write(s.replace(old, old + add))
          PY
      - name: Full page viewer
        run: |
          python3 - <<'PY'
          p = 'anwar_library/lib/main.dart'
          s = open(p, encoding='utf-8').read()
          a = s.index('class PdfScreen extends StatefulWidget')
          b = s.index('// ---------- المفضلة')
          new = r"""
          class PdfScreen extends StatefulWidget {
            final Book book;
            final int page;
            const PdfScreen(this.book, this.page, {super.key});
            @override
            State<PdfScreen> createState() => _PdfScreenState();
          }

          class _PdfScreenState extends State<PdfScreen> {
            late final PdfController c;
            @override
            void initState() {
              super.initState();
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              c = PdfController(document: PdfDocument.openAsset(widget.book.pdf), initialPage: widget.page);
            }

            @override
            void dispose() {
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  backgroundColor: Colors.white,
                  body: Stack(children: [
                    PdfView(controller: c, pageSnapping: true),
                    Positioned(
                      top: 6,
                      right: 6,
                      child: SafeArea(
                        child: CircleAvatar(
                          backgroundColor: Colors.black45,
                          child: IconButton(
                            icon: const Icon(Icons.arrow_back, color: Colors.white),
                            onPressed: () => Navigator.pop(context),
                          ),
                        ),
                      ),
                    ),
                    Positioned(
                      bottom: 6,
                      left: 0,
                      right: 0,
                      child: Center(
                        child: PdfPageNumber(
                          controller: c,
                          builder: (_, __, page, count) => Container(
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                            decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(14)),
                            child: Text('$page / ${count ?? 0}', style: const TextStyle(color: Colors.white)),
                          ),
                        ),
                      ),
                    ),
                  ]),
                );
          }
          """
          open(p, 'w', encoding='utf-8').write(s[:a] + new.lstrip() + '\n' + s[b:])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: anwar_library
        run: |
          flutter create --org com.anwar --project-name anwar_library --platforms android .
          sed -i 's/android:label="[^"]*"/android:label="مكتبة الأنوار المحمدية"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anwar-apk
          path: anwar_library/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
